spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

storage:
  base-url: ""
  service-token: ""
  grpc:
    deadline-ms: 2000

grpc:
  client:
    storage:
      address: static://127.0.0.1:9090
      negotiation-type: plaintext

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
