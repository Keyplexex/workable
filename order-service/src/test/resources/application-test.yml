spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

storage:
  base-url: ""
  service-token: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
